<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RMR - merenje: da li se replay može snimiti</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  :root { --bg:#05080B; --card:#0d141c; --line:#22303f; --fg:#e6edf3; --mut:#8fa3b8; --ok:#37d67a; --no:#ff6b6b; --acc:#FF6A00; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 -apple-system,system-ui,sans-serif;
         padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
  h1 { font-size:19px; margin:0 0 4px; }
  .sub { color:var(--mut); font-size:13px; margin-bottom:16px; }
  #map { width:100%; height:210px; border-radius:12px; overflow:hidden; border:1px solid var(--line); background:#0b1426; }
  .row { display:flex; gap:10px; align-items:baseline; padding:9px 0; border-bottom:1px solid var(--line); }
  .row b { flex:1; font-weight:600; font-size:14px; }
  .v { font-family:ui-monospace,Menlo,monospace; font-size:13px; text-align:right; word-break:break-all; }
  .ok { color:var(--ok); } .no { color:var(--no); } .mut { color:var(--mut); }
  button { width:100%; margin:16px 0 8px; padding:15px; border:0; border-radius:12px; font:700 16px system-ui;
           background:linear-gradient(135deg,var(--acc),#c2410c); color:#fff; }
  button:disabled { opacity:.5; }
  #ish { margin-top:14px; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card); font-size:14px; }
  #kopiraj { background:#1c2733; color:var(--fg); font-weight:600; }
  video { width:100%; margin-top:12px; border-radius:12px; border:1px solid var(--line); display:none; }
</style>
</head>
<body>
<h1>Može li se replay snimiti kao video?</h1>
<div class="sub">Otvori ovo na telefonu i pritisni dugme. Traje oko 6 sekundi. Ništa se ne šalje - sve se meri na uređaju.</div>

<div id="map"></div>
<button id="kreni">Izmeri</button>
<div id="lista"></div>
<div id="ish" class="mut">Još nije mereno.</div>
<video id="pregled" controls playsinline muted></video>
<button id="kopiraj" style="display:none">Kopiraj nalaz</button>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const L = document.getElementById("lista"), ISH = document.getElementById("ish");
const nalaz = [];
function red(ime, vred, stanje) {
  nalaz.push(ime + ": " + vred);
  const d = document.createElement("div");
  d.className = "row";
  d.innerHTML = '<b>' + ime + '</b><span class="v ' + (stanje || "mut") + '">' + String(vred).replace(/</g, "&lt;") + '</span>';
  L.appendChild(d);
}

/* preserveDrawingBuffer je OBAVEZAN da bi se WebGL platno moglo uhvatiti. Glavna aplikacija ga
   NEMA - zato ovo merenje pravi svoju mapu, da izmeri i cenu koju bi ukljucivanje donelo. */
const map = new maplibregl.Map({
  container: "map", style: "https://tiles.openfreemap.org/styles/positron",
  center: [20.45, 44.80], zoom: 14, pitch: 60, bearing: 20,
  preserveDrawingBuffer: true, attributionControl: false,
});

document.getElementById("kreni").addEventListener("click", async () => {
  const b = document.getElementById("kreni");
  b.disabled = true; b.textContent = "merim…"; L.innerHTML = ""; nalaz.length = 0;
  ISH.className = "mut"; ISH.textContent = "u toku…";

  red("uređaj", navigator.userAgent.slice(0, 78));
  red("režim", window.matchMedia("(display-mode: standalone)").matches ? "sa početnog ekrana" : "Safari", "mut");

  const imaMR = typeof MediaRecorder !== "undefined";
  red("MediaRecorder postoji", imaMR ? "da" : "NE", imaMR ? "ok" : "no");

  let tipovi = [];
  if (imaMR && MediaRecorder.isTypeSupported) {
    for (const t of ["video/mp4", "video/mp4;codecs=avc1", "video/webm", "video/webm;codecs=vp8", "video/webm;codecs=vp9", "video/webm;codecs=h264"]) {
      if (MediaRecorder.isTypeSupported(t)) tipovi.push(t);
    }
  }
  red("podržani formati", tipovi.length ? tipovi.join(", ") : "nijedan", tipovi.length ? "ok" : "no");

  const cnv = map.getCanvas();
  const imaCS = typeof cnv.captureStream === "function";
  red("captureStream na platnu", imaCS ? "da" : "NE", imaCS ? "ok" : "no");
  red("veličina platna", cnv.width + "x" + cnv.height + " (dpr " + (window.devicePixelRatio || 1) + ")");

  if (!imaMR || !imaCS || !tipovi.length) {
    ISH.className = "no";
    ISH.textContent = "Video se na ovom uređaju NE može snimiti iz aplikacije. Izvoz bi morao drugim putem.";
    b.textContent = "Izmeri ponovo"; b.disabled = false;
    document.getElementById("kopiraj").style.display = "block";
    return;
  }

  /* Merimo i CENU: koliko kadrova mapa stvarno isporuci dok snimanje traje. Ako padne ispod
     ~20, replay bi u snimku bio trzav i izvoz nema smisla ni ako tehnicki radi. */
  let kadrova = 0, radi = true;
  const broj = () => { if (radi) { kadrova++; requestAnimationFrame(broj); } };
  requestAnimationFrame(broj);

  let blob = null, greska = null;
  try {
    const stream = cnv.captureStream(30);
    red("traka u toku", stream.getVideoTracks().length + " video traka", stream.getVideoTracks().length ? "ok" : "no");
    const rec = new MediaRecorder(stream, { mimeType: tipovi[0], videoBitsPerSecond: 4000000 });
    const delovi = [];
    rec.ondataavailable = (e) => { if (e.data && e.data.size) delovi.push(e.data); };
    const gotovo = new Promise((res) => { rec.onstop = res; });
    rec.start(250);
    const t0 = performance.now();
    // mapa se krece, kao u replayu - staticna slika bi lazno prosla
    const anim = setInterval(() => { try { map.jumpTo({ bearing: (map.getBearing() + 4) % 360 }); } catch (e) {} }, 60);
    await new Promise((r) => setTimeout(r, 5000));
    clearInterval(anim);
    rec.stop(); await gotovo;
    radi = false;
    const sek = (performance.now() - t0) / 1000;
    red("kadrova u sekundi", (kadrova / sek).toFixed(1), (kadrova / sek) >= 20 ? "ok" : "no");
    blob = new Blob(delovi, { type: tipovi[0] });
  } catch (e) { radi = false; greska = String(e && e.message || e); }

  if (greska) red("greška pri snimanju", greska, "no");
  const velKB = blob ? Math.round(blob.size / 1024) : 0;
  red("snimljeno", blob ? velKB + " KB (" + blob.type + ")" : "ništa", velKB > 40 ? "ok" : "no");

  if (blob && velKB > 40) {
    const v = document.getElementById("pregled");
    v.src = URL.createObjectURL(blob); v.style.display = "block";
    ISH.className = "ok";
    ISH.textContent = "Snimanje RADI na ovom uređaju. Ostaje još samo pitanje čuvanja u Fotografije iz naše ljuske - to se rešava nativnim dodatkom.";
  } else if (!greska) {
    ISH.className = "no";
    ISH.textContent = "Snimanje je prošlo bez greške ali je fajl prazan - platno se ne hvata. Izvoz ovim putem ne bi radio.";
  } else {
    ISH.className = "no";
    ISH.textContent = "Snimanje je puklo. Izvoz ovim putem ne bi radio.";
  }
  b.textContent = "Izmeri ponovo"; b.disabled = false;
  document.getElementById("kopiraj").style.display = "block";
});

document.getElementById("kopiraj").addEventListener("click", () => {
  const t = "RMR merenje videa\n" + nalaz.join("\n");
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(() => alert("Kopirano - nalepi mi u poruku."));
  else prompt("Kopiraj:", t);
});
</script>
</body>
</html>
