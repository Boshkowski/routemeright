name: Stanje na putevima + meteo upozorenja
# Sakuplja stanje na putevima (10 zemalja) i zvanicna meteo-upozorenja (Meteoalarm)
# u data/road_status.json - app ga cita staticki (nema server-a).
# Od 1.11.2026 (BUILD-PLAN 0.4) robot NE komituje: oba fajla salje u R2 kroz https://routemeright.app/_robot/
# (site/src/robot.js), a sajt ih sluzi odatle. Kljuca nema: GitHub izda kratak OIDC token (id-token: write), a
# Worker pusta samo road-status.yml sa main-a javnog repoa. Rad pocinje od poslednjih fajlova sa sajta, jer oba
# skripta grade na prethodnom stanju (zemlja koja ne odgovori zadrzava stare podatke). Iz dev repoa upload ne prolazi.
on:
  schedule:
    - cron: "17 * * * *"   # svakih sat vremena (Actions besplatan za javne repoe; commit samo ako ima promena)
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write   # kratak OIDC token za upload u R2 (umesto komita)
concurrency:
  group: road-status
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Repo kopije su zamrznute od 1.11.: poslednje stanje je ono koje sajt sluzi (R2).
      - name: Poslednji podaci sa sajta
        run: |
          for f in road_status.json prices.json; do
            if curl -sf --max-time 30 "https://routemeright.app/data/$f?robot=$GITHUB_RUN_ID" -o "/tmp/$f" \
               && python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if isinstance(d, dict) and d else 1)' "/tmp/$f"; then
              mv "/tmp/$f" "data/$f"; echo "$f: sa sajta ($(wc -c < "data/$f") B)"
            else
              echo "::warning::$f: sajt nije dao ispravan JSON - robot krece od kopije u repou"
            fi
          done
      - name: Sakupi podatke
        run: python3 tools/collect_road_status.py
      - name: Tesseract OCR (Kosovo objavljuje cene samo kao sliku)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
        continue-on-error: true
      # 3.10.2026 (pregled V20): `|| true` skinut - isti obrazac koji je sest nedelja krio Supabase 401.
      # continue-on-error ostaje da pad updatera ne zaustavi komit stanja na putevima, ali se korak vidi
      # kao crven u logu, a poslednji korak ispod PADA ako su cene stvarno stale.
      - name: Osvezi cene goriva (benzin BMB95 po zemljama)
        run: python3 update_prices.py
        continue-on-error: true
      # 1.11.2026: umesto komita. Token traje nekoliko minuta i vazi samo za ovaj workflow na main-u (site/src/robot.js).
      - name: Objavi u R2 (sajt cita odatle)
        run: |
          for f in road_status.json prices.json; do
            for i in 1 2 3; do
              TOK=$(curl -sf --max-time 20 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://routemeright.app/_robot" \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])') || TOK=""
              [ -n "$TOK" ] && echo "::add-mask::$TOK"
              KOD=$(curl -s -o /tmp/r2.out -w "%{http_code}" --max-time 60 -X PUT -H "Authorization: Bearer $TOK" \
                -H "Content-Type: application/json" --data-binary "@data/$f" "https://routemeright.app/_robot/data/$f") || KOD="$KOD (curl izlaz $?)"
              [ "$KOD" = "200" ] && { echo "$f: $(cat /tmp/r2.out)"; break; }
              echo "$f, pokusaj $i: HTTP $KOD $(head -c 200 /tmp/r2.out 2>/dev/null)"
              [ "$i" = 3 ] && { echo "::error::$f nije stigao u R2 ni posle 3 pokusaja (poslednji: HTTP $KOD) - sajt i dalje sluzi prethodni"; exit 1; }
              sleep 15
            done
          done
      # 3.10.2026 (pregled V20): cene ne smeju da stanu bez mejla. Najnoviji datum u data/prices.json
      # (meta.updated ili bilo koji verified) stariji od 3 dana = posao PADA ("Run failed" mejl).
      # Stoji POSLE objave da zastarele cene ne zadrze svez road_status.json.
      - name: Cene goriva ne smeju da zastare (najnoviji datum u prices.json stariji od 3 dana = kvar)
        run: |
          python3 - <<'PY'
          import datetime, json, re, sys
          s = open("data/prices.json", encoding="utf-8").read()
          json.loads(s)   # pokvaren JSON je isti kvar kao zastareo
          datumi = []
          for d in set(re.findall(r"\b(20\d\d-\d\d-\d\d)\b", s)):
              try: datumi.append(datetime.date.fromisoformat(d))
              except ValueError: pass
          naj = max(datumi) if datumi else None
          star = (datetime.date.today() - naj).days if naj else None
          print(f"najnoviji datum u data/prices.json: {naj} ({star} dana)")
          if naj is None or star > 3:
              print(f"::error::data/prices.json: najnovija cena je od {naj} ({star} dana) - update_prices.py ne upisuje, vidi korak 'Osvezi cene goriva'")
              sys.exit(1)
          PY
      # 14.9.2026: ping je gadjao tabelu `prijave`, koja je RLS-om zatvorena za anon rolu -
      # i to NAMERNO (app cita kroz pogled `prijave_javno`). Ping je dodat 3.8.2026, ISTOG DANA
      # kad i RLS sema, pa je bio pogresan od prvog sata: sest nedelja je vracao HTTP 401
      # "permission denied for table prijave", a `|| true` + continue-on-error su to tiho gutali.
      # Supabase je 13.9. poslao najavu pauziranja zbog neaktivnosti.
      # Sada se gadja ISTI pogled koji cita i aplikacija, i korak PADA ako ping ne prodje.
      # 21.10.2026: ping je stajao PRE komita - jutros (Supabase incident "Projects stuck in restarting state") baza nije
      # odgovorila za 20 s, korak je pao sa curl izlazom 28 (bez ::error:: poruke, bash -e), i robot je BACIO vec sakupljeno
      # stanje na putevima (komit preskocen). Sada stoji POSLE komita (kao provera cena), radi uvek (if: always()), pokusava
      # 3 puta po 20 s uz pauzu 15 s - prolazni zastoj nije alarm - i tek onda PADA glasno. tools/robot-workflow.test.mjs
      - name: Supabase ping (besplatna baza zaspi posle 7 dana bez saobracaja)
        if: always()
        run: |
          for i in 1 2 3; do
            KOD=$(curl -s -o /tmp/ping.out -w "%{http_code}" --max-time 20 \
              "https://sankrmswthypvwevzdwz.supabase.co/rest/v1/prijave_javno?select=id&limit=1" \
              -H "apikey: sb_publishable_RTYwIJ1CuNB9xCSoMAyWtA_Y89-QXiI" \
              -H "Authorization: Bearer sb_publishable_RTYwIJ1CuNB9xCSoMAyWtA_Y89-QXiI") || KOD="$KOD (curl izlaz $?)"
            echo "Supabase ping, pokusaj $i: HTTP $KOD"
            [ "$KOD" = "200" ] && exit 0
            [ "$i" = 3 ] || sleep 15
          done
          echo "::error::Supabase ping nije prosao ni posle 3 pokusaja (poslednji: HTTP $KOD) - baza ce biti pauzirana posle 7 dana bez saobracaja."
          head -c 400 /tmp/ping.out 2>/dev/null; exit 1
